[package]
name = "stamp_explorer_indexer"
version = "0.1.0"
edition = "2021"
description = "Browser-safe Rust/Wasm Bitcoin Stamps transaction indexer"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
md-5 = "0.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
